name: Ultimate Multi-Branch Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-master:
    name: Sync master branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git
          git fetch upstream
          
      - name: Configure Git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      - name: Create sync branch
        run: |
          git checkout -B sync-master origin/master
          git merge upstream/master --no-commit --no-ff || true

      - name: Remove upstream workflow changes
        run: |
          git restore --staged .github/workflows || true
          git restore .github/workflows || true

      - name: Detect conflicts
        id: conflicts_master
        run: |
          if git ls-files -u | grep -q .; then
            echo "conflicts=true" >> $GITHUB_OUTPUT
          else
            echo "conflicts=false" >> $GITHUB_OUTPUT
          fi
          
      

      - name: Commit merge if no conflicts
        if: steps.conflicts_master.outputs.conflicts == 'false'
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "Sync master with upstream (excluding workflows)"
          fi

      - name: Push changes
        if: steps.conflicts_master.outputs.conflicts == 'false'
        run: |
          if ! git diff origin/master..sync-master --quiet; then
            git push https://x-access-token:${{ secrets.PAT_SYNC }}@github.com/TheNeskik/AndroidAPS.git sync-master:master
          fi

      - name: Trigger dev CI
        if: steps.conflicts_master.outputs.conflicts == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_SYNC }}
        run: |
          if ! git diff origin/master..sync-master --quiet; then
            echo "Triggering Branch CI workflow on master..."
            curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/TheNeskik/AndroidAPS/dispatches \
            -d '{"event_type":"sync_build","client_payload":{"branch":"master"}}'
          fi

      - name: Create PR on conflict
        if: steps.conflicts_master.outputs.conflicts == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: conflict-sync-master
          title: "⚠️ Conflits détectés sur master"
          body: |
            Des conflits ont été détectés lors de la synchronisation automatique de la branche **master**.
            Branche de travail : `sync-master`
          base: master
          delete-branch: true
          
      - name: Notify Discord about merge conflict
        if: steps.conflicts_master.outputs.conflicts == 'true'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"⚠️ Merge conflict détecté sur la branche **master** du fork AndroidAPS ! Une PR a été créée pour résolution.\"}" \
               ${{ secrets.DISCORD_WEBHOOK_SYNC }}
